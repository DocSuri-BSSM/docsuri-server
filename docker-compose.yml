services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-docsuri}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-docsuri}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-docsuri}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY가 .env에 설정되어 있어야 합니다}
      GEMINI_MODEL_REASONING: ${GEMINI_MODEL_REASONING:-gemini-3.1-flash-lite}
      GEMINI_MODEL_FAST: ${GEMINI_MODEL_FAST:-gemini-3.1-flash-lite}
      APP_OCR_PROVIDER: ${APP_OCR_PROVIDER:-gemini}
    ports:
      - "8080:8080"
    volumes:
      - app-storage:/app/storage
    restart: unless-stopped

volumes:
  db-data:
  app-storage:
